name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    name: Build and Test (Linux)
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "file:./dev.db"
      NEXTAUTH_SECRET: "ci-secret-key-for-build-and-tests-12345"
      NEXTAUTH_URL: "http://localhost:3000"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client & apply SQLite migrations
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build Next.js
        run: npm run build

  electron-windows:
    name: Electron Windows Package & Runtime Validation
    runs-on: windows-latest

    env:
      DATABASE_URL: "file:./dev.db"
      NEXTAUTH_SECRET: "ci-secret-key-for-build-and-tests-12345"
      NEXTAUTH_URL: "http://localhost:3000"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client & apply SQLite migrations
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Build Next.js & package Electron application
        run: npm run electron:pack

      - name: Verify clean-install packaged Electron runtime & graceful shutdown
        shell: powershell
        run: |
          $cleanDir = Join-Path $env:TEMP ("mlocker-ci-pack-" + [System.Guid]::NewGuid().ToString())
          New-Item -ItemType Directory -Path $cleanDir | Out-Null
          $exePath = Resolve-Path "dist\win-unpacked\Media Locker.exe"
          Write-Host "Launching packaged executable with clean userData at $cleanDir in test mode"

          $proc = Start-Process -FilePath $exePath -ArgumentList "--user-data-dir=`"$cleanDir`" --test-mode" -PassThru

          $timeoutSec = 15
          $elapsed = 0
          $dbPath = Join-Path $cleanDir "mlocker.db"
          while (-not (Test-Path $dbPath) -and $elapsed -lt $timeoutSec) {
            Start-Sleep -Seconds 1
            $elapsed++
            if ($proc.HasExited) {
              throw "Packaged Electron app terminated prematurely (exit code: $($proc.ExitCode))"
            }
          }

          if (-not (Test-Path $dbPath)) {
            Stop-Process -Id $proc.Id -Force
            throw "Expected provisioned database was not created at $dbPath within $timeoutSec seconds"
          }

          # Verify database schema, version, and integrity using node:sqlite
          $inspectScript = @"
          const { DatabaseSync } = require('node:sqlite');
          const db = new DatabaseSync('$($dbPath -replace '\\', '/')');
          const version = db.prepare('PRAGMA user_version').get();
          const integrity = db.prepare('PRAGMA integrity_check').all();
          const tables = db.prepare('SELECT name FROM sqlite_master WHERE type = ?').all('table').map(t => t.name);
          console.log('Version:', JSON.stringify(version));
          console.log('Integrity:', JSON.stringify(integrity));
          console.log('Tables:', JSON.stringify(tables));
          if (!version || version.user_version !== 3) {
            console.error('Invalid version: expected 3, got', version);
            process.exit(1);
          }
          if (!integrity || integrity.length === 0 || integrity[0].integrity_check !== 'ok') {
            console.error('Integrity check failed:', integrity);
            process.exit(1);
          }
          const required = ['User', 'UserMedia', 'Collection', 'CollectionItem', '_prisma_migrations', 'MediaSource', 'ActivitySession', 'ActivityEvent'];
          for (const req of required) {
            if (!tables.includes(req)) {
              console.error('Missing table:', req);
              process.exit(1);
            }
          }
          console.log('CI Database Verification Passed Successfully!');
          "@

          node -e "$inspectScript"
          $nodeExit = $LASTEXITCODE

          if ($nodeExit -ne 0) {
            Stop-Process -Id $proc.Id -Force
            Remove-Item -Recurse -Force $cleanDir -ErrorAction SilentlyContinue
            throw "Database verification script failed with code $nodeExit"
          }

          # Trigger graceful application exit through narrowly-scoped test signal
          Write-Host "Database verification successful. Triggering graceful application shutdown..."
          $signalFile = Join-Path $cleanDir "shutdown.signal"
          New-Item -ItemType File -Path $signalFile -Force | Out-Null

          # Wait for the Electron process to terminate within a reasonable timeout
          Write-Host "Waiting up to 15 seconds for Electron process to terminate gracefully..."
          $exitedGracefully = $proc.WaitForExit(15000)

          if (-not $exitedGracefully) {
            Write-Host "Graceful shutdown timed out after 15 seconds. Force terminating process as cleanup..."
            Stop-Process -Id $proc.Id -Force
            Remove-Item -Recurse -Force $cleanDir -ErrorAction SilentlyContinue
            throw "Graceful shutdown verification failed: Electron process did not terminate within 15 seconds"
          }

          Write-Host "Electron process terminated. Exit code: $($proc.ExitCode)"
          if ($proc.ExitCode -ne 0) {
            Remove-Item -Recurse -Force $cleanDir -ErrorAction SilentlyContinue
            throw "Graceful shutdown verification failed: process exited with abnormal exit code $($proc.ExitCode)"
          }

          Write-Host "Graceful shutdown verified: application closed cleanly with exit code 0."
          Remove-Item -Recurse -Force $cleanDir -ErrorAction SilentlyContinue
          Write-Host "Packaged Electron runtime & graceful shutdown verification on Windows passed successfully."
